<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <clipPath id="mClip">
      <rect x="-80" y="-45" width="80" height="90" />
    </clipPath>
  </defs>

  <!-- Soft creamy off-white background matching the original -->
  <rect width="100%" height="100%" fill="#F8F6F0" />
  
  <!-- Continuous geometric S curve -->
  <path d="M 560 160 
           A 70 70 0 0 0 490 90 
           L 345 90 
           A 105 105 0 0 0 240 195 
           A 105 105 0 0 0 345 300 
           L 455 300 
           A 105 105 0 0 1 560 405 
           A 105 105 0 0 1 455 510 
           L 310 510 
           A 70 70 0 0 1 240 440" 
        fill="none" stroke="#0B1B32" stroke-width="18" stroke-linecap="round" />
        
  <!-- Top IMO -->
  <!-- Using pure geometric vector drawing instead of fonts to guarantee identical flawless rendering -->
  <g transform="translate(400, 195)" stroke="#0B1B32" stroke-width="22" stroke-linejoin="miter" stroke-linecap="butt" fill="none">
     <!-- I -->
     <line x1="-101" y1="-45" x2="-101" y2="45" />
     <!-- M (Clipped to prevent miter spikes and guarantee perfect flat tops) -->
     <g clip-path="url(#mClip)">
         <path d="M -58 45 L -58 -45 L -34 15 L -10 -45 L -10 45" stroke-miterlimit="10" />
     </g>
     <!-- O -->
     <circle cx="67" cy="0" r="34" />
  </g>
  
  <!-- Bottom IMO -->
  <g transform="translate(400, 405)" stroke="#0B1B32" stroke-width="22" stroke-linejoin="miter" stroke-linecap="butt" fill="none">
     <line x1="-101" y1="-45" x2="-101" y2="45" />
     <g clip-path="url(#mClip)">
         <path d="M -58 45 L -58 -45 L -34 15 L -10 -45 L -10 45" stroke-miterlimit="10" />
     </g>
     <circle cx="67" cy="0" r="34" />
  </g>
</svg>
