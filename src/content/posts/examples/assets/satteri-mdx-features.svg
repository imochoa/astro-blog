<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Sätteri and MDX feature map</title>
  <desc id="description">Markdown flows through Sätteri and MDX into an Astro page.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e0ebe7" />
      <stop offset="1" stop-color="#f6f8f7" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)" />
  <g fill="#fff" stroke="#36665a" stroke-width="6">
    <rect x="90" y="220" width="260" height="190" rx="24" />
    <rect x="470" y="220" width="260" height="190" rx="24" />
    <rect x="850" y="220" width="260" height="190" rx="24" />
  </g>
  <g fill="none" stroke="#36665a" stroke-linecap="round" stroke-width="12">
    <path d="M365 315h80" />
    <path d="m425 290 25 25-25 25" />
    <path d="M745 315h80" />
    <path d="m805 290 25 25-25 25" />
  </g>
  <g fill="#202724" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="56" font-weight="700">Sätteri + MDX + Astro</text>
    <text x="220" y="300" font-size="42" font-weight="700">Markdown</text>
    <text x="220" y="350" font-size="26">content</text>
    <text x="600" y="300" font-size="42" font-weight="700">Sätteri</text>
    <text x="600" y="350" font-size="26">parse + transform</text>
    <text x="980" y="300" font-size="42" font-weight="700">Astro</text>
    <text x="980" y="350" font-size="26">optimized HTML</text>
    <text x="600" y="530" font-size="28">A local SVG imported through astro:assets</text>
  </g>
</svg>
