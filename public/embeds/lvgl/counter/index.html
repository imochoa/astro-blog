<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>LVGL counter simulator</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        color: #cccccc;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      h1 {
        margin-bottom: 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        opacity: 0.6;
      }

      canvas {
        border: 2px solid #333333;
        border-radius: 6px;
        image-rendering: pixelated;
      }

      footer {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.2rem 0.4rem;
        font-size: 0.75rem;
        opacity: 0.55;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>LVGL Simulator</h1>
    <canvas id="canvas" tabindex="-1"></canvas>
    <footer>
      <span id="status">Loading Wasm...</span>
      <span aria-hidden="true">·</span>
      <span>Licenses:</span>
      <a href="LICENSE-LVGL.txt">LVGL</a>
      <a href="LICENSE-SDL.txt">SDL</a>
      <a href="LICENSE-EMSCRIPTEN.txt">Emscripten</a>
    </footer>
    <script>
      const canvas = document.getElementById("canvas");
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      var Module = {
        canvas,
        onRuntimeInitialized() {
          document.getElementById("status").textContent = "Running";
        },
      };
    </script>
    <script async src="counter.js"></script>
  </body>
</html>
